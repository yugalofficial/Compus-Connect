    <meta property="og:title" content="Campus Connect V2" />
    <meta property="og:description" content="Event management, QR attendance, canteen food coupons, and super admin control for college campuses." />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        if (window.fetch) {
          const originalFetch = window.fetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function(v) {
                console.warn('Blocked attempt to overwrite window.fetch.', v);
              },
              configurable: false
            });
          } catch (e) {}
        }
      })();
    </script>
